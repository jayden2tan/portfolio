<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>Resume | Jayden Tan</title>
    <meta name="description" content="Resume of Jayden Tan.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ==========================================
       DESIGN SYSTEM & CSS VARIABLES (matches portfolio)
       ========================================== */
        :root {
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;

            --transition-fast: 200ms cubic-bezier(0.16, 1, 0.3, 1);
            --transition-normal: 300ms cubic-bezier(0.16, 1, 0.3, 1);

            --accent: #2563eb;
            --accent-rgb: 37, 99, 235;
            --accent-glow: rgba(var(--accent-rgb), 0.15);

            --bg-base: #0a0a0c;
            --bg-surface: rgba(18, 18, 22, 0.6);
            --bg-surface-opaque: #121216;
            --bg-surface-hover: rgba(24, 24, 30, 0.7);

            --border-color: rgba(255, 255, 255, 0.05);
            --border-color-hover: rgba(255, 255, 255, 0.12);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --nav-glass: rgba(10, 10, 12, 0.75);

            --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 12px 30px -4px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: rgba(255, 255, 255, 0.6);
            --bg-surface-opaque: #ffffff;
            --bg-surface-hover: rgba(241, 245, 249, 0.7);

            --border-color: rgba(0, 0, 0, 0.06);
            --border-color-hover: rgba(0, 0, 0, 0.12);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;

            --nav-glass: rgba(248, 250, 252, 0.75);

            --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 12px 30px -4px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 50px -10px rgba(0, 0, 0, 0.1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color var(--transition-normal), color var(--transition-normal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(circle at 10% 20%, rgba(var(--accent-rgb), 0.04) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(var(--accent-rgb), 0.03) 0%, transparent 45%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        h1,
        h2 {
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        /* ==========================================
       NAVIGATION HEADER
       ========================================== */
        .header-nav {
            position: sticky;
            top: 0;
            width: 100%;
            height: 72px;
            z-index: 100;
            background: var(--nav-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }

        .logo-container {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.35rem;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link {
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: border-color var(--transition-fast), background-color var(--transition-fast);
        }

        .theme-toggle-btn:hover {
            border-color: var(--border-color-hover);
            background-color: var(--bg-surface-hover);
        }

        /* ==========================================
       MAIN / RESUME AREA
       ========================================== */
        main {
            flex: 1;
            padding: 56px 0 96px;
        }

        .resume-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }

        .resume-title {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
        }

        .resume-subtitle {
            color: var(--text-secondary);
            margin-top: 6px;
            font-size: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform var(--transition-fast),
                background-color var(--transition-fast),
                border-color var(--transition-fast),
                box-shadow var(--transition-fast);
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* PDF viewer frame */
        .resume-viewer {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .resume-viewer iframe {
            width: 100%;
            height: 80vh;
            min-height: 500px;
            border: none;
            display: block;
            background: var(--bg-surface-opaque);
        }

        /* Fallback shown if the PDF can't be embedded/found */
        .viewer-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
        }

        .viewer-fallback svg {
            width: 48px;
            height: 48px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.5;
        }

        .resume-viewer.no-pdf iframe {
            display: none;
        }

        .resume-viewer.no-pdf .viewer-fallback {
            display: flex;
        }

        @media (max-width: 640px) {
            .resume-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn {
                width: 100%;
            }

            .resume-viewer iframe {
                height: 65vh;
            }
        }
    </style>
</head>

<body>

    <header class="header-nav" role="banner">
        <div class="container nav-container">
            <a href="index.html" class="logo-container" aria-label="Jayden Tan Portfolio Home">
                <span>Resume</span>
            </a>

            <div style="display:flex; align-items:center; gap:24px;">
                <a href="index.html" class="back-link">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Portfolio
                </a>

                <button class="theme-toggle-btn" aria-label="Switch Dark/Light Theme">
                    <svg class="sun-icon" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="resume-header">
                <div>
                    <h1 class="resume-title">Resume</h1>
                    <p class="resume-subtitle">View or download my resume below.</p>
                </div>

                <!-- Download button: points at the same PDF shown in the viewer -->
                <a href="files/Jayden_Tan_Resume.pdf" class="btn btn-primary" download="Jayden-Tan-Resume.pdf"
                    id="download-resume-btn">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download Resume
                </a>
            </div>

            <!-- Embedded PDF viewer. Change the src/href above and below to your resume's filename. -->
            <div class="resume-viewer" id="resume-viewer">
                <iframe id="resume-iframe" src="files/Jayden_Tan_Resume.pdf" title="Jayden Tan Resume PDF"></iframe>

                <div class="viewer-fallback">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <p>The resume couldn't be loaded here.<br>Use the download button above to get a copy directly.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Theme management (shared behavior/keys with the main portfolio page)
        const themeToggleBtn = document.querySelector('.theme-toggle-btn');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const getPreferredTheme = () => {
            const storedTheme = localStorage.getItem('portfolio-theme');
            if (storedTheme) return storedTheme;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        };

        const setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('portfolio-theme', theme);
            if (theme === 'light') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        };

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        });

        setTheme(getPreferredTheme());

        // ==========================================
        // PDF LOAD DETECTION
        // ==========================================
        // NOTE: We intentionally do NOT use fetch() here. A fetch() HEAD
        // request to a local file fails under the file:// protocol in most
        // browsers (blocked by CORS) even when the PDF exists and the iframe
        // itself can render it fine. That mismatch was causing the fallback
        // message to show incorrectly. Instead we rely on the iframe's own
        // load/error behavior, which works whether the page is opened
        // directly (file://) or served over http(s)://.
        const viewer = document.getElementById('resume-viewer');
        const iframe = document.getElementById('resume-iframe');

        let resolved = false;

        const markMissing = () => {
            if (resolved) return;
            resolved = true;
            viewer.classList.add('no-pdf');
        };

        const markLoaded = () => {
            resolved = true;
            viewer.classList.remove('no-pdf');
        };

        iframe.addEventListener('load', () => {
            // Some browsers still fire 'load' for a failed/blocked PDF request
            // (e.g. a 404 page or an about:blank swap), so double check that
            // the frame actually reached the PDF rather than an error page.
            try {
                const loadedUrl = iframe.contentWindow && iframe.contentWindow.location
                    ? iframe.contentWindow.location.href
                    : iframe.src;
                if (loadedUrl && loadedUrl.indexOf('.pdf') === -1 && loadedUrl !== iframe.src) {
                    markMissing();
                    return;
                }
            } catch (e) {
                // Cross-origin or sandboxed access — assume success, the
                // browser already rendered something in the frame.
            }
            markLoaded();
        });

        iframe.addEventListener('error', markMissing);

        // Fallback safety net: if neither load nor error fires within a few
        // seconds (can happen with some local PDF viewer plugins), assume it
        // loaded rather than leaving the user on a blank frame.
        setTimeout(() => {
            if (!resolved) markLoaded();
        }, 4000);
    </script>
</body>

</html>
